name: CI

"on":
  push:
    branches:
      - main
      - feature/integrate-backend-structure
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webhooks_test
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run database migrations
        run: node scripts/migrate.js
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: webhooks
          DATABASE_PASSWORD: webhooks
          DATABASE_NAME: webhooks_test
          DATABASE_URL: postgresql://webhooks:webhooks@localhost:5432/webhooks_test

      - name: Run unit & integration tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: webhooks
          DATABASE_PASSWORD: webhooks
          DATABASE_NAME: webhooks_test
          DATABASE_URL: postgresql://webhooks:webhooks@localhost:5432/webhooks_test
          WEBHOOK_SECRET_ENCRYPTION_KEY: xtjJgOfow8xiWAGfiGe6t0aS9tD2ml8WQyA+524ki7A=

  frontend:
    name: Frontend (Lint, Test & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run component & integration tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Run production build
        run: npm run build
