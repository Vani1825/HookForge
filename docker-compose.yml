services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: webhooks
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: webhooks
      DATABASE_PASSWORD: webhooks
      DATABASE_NAME: webhooks
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: sh -c "node scripts/migrate.js && node scripts/seed.js && node src/server.js"
    ports:
      - "${BACKEND_PORT:-${PORT:-8080}}:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
